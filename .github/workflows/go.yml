name: Go CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Verify Go setup and download dependencies
      run: |
        go version
        go env
        go mod download

    - name: Run tests with QUIC setup
      run: |
        # Setup UDP buffers and other network parameters for QUIC
        sudo sysctl -w net.core.rmem_max=67108864
        sudo sysctl -w net.core.wmem_max=67108864
        sudo sysctl -w net.core.rmem_default=67108864
        sudo sysctl -w net.core.wmem_default=67108864

        # Run only unit tests (skip integration and stress tests)
        set -o pipefail
        timeout 10m go test -v -short -timeout=8m ./... 2>&1 | tee test-output.txt

    - name: Code quality checks
      run: |
        # Install golangci-lint
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

        # Run linter
        golangci-lint run --timeout=5m

        # Check formatting
        if [ -n "$(gofmt -s -l .)" ]; then
          echo "Code needs formatting:"
          gofmt -s -l .
          exit 1
        fi

    - name: Test summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        TOTAL=$(grep -c "^=== RUN" test-output.txt || echo "0")
        PASSED=$(grep -c "^--- PASS" test-output.txt || echo "0")
        FAILED=$(grep -c "^--- FAIL" test-output.txt || echo "0")

        echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Total Tests | $TOTAL |" >> $GITHUB_STEP_SUMMARY
        echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
        echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "$FAILED" -eq 0 ]; then
          echo "All tests passed!" >> $GITHUB_STEP_SUMMARY
        else
          echo "$FAILED test(s) failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
          grep "^--- FAIL" test-output.txt >> $GITHUB_STEP_SUMMARY || true
        fi

    - name: Upload test output
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.run_number }}
        path: test-output.txt
        retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Build
      run: GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -v ./...

