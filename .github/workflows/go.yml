name: Go CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Get dependencies
      run: go mod download

    - name: Run tests
      run: go test -v -timeout=10m ./... 2>&1 | tee test-output.txt

    - name: Run linter
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -s -l .)" ]; then
          echo "Code needs formatting:"
          gofmt -s -l .
          exit 1
        fi

    - name: Test summary
      if: always()
      run: |
        PASSED=$(grep -c "^--- PASS" test-output.txt || echo "0")
        FAILED=$(grep -c "^--- FAIL" test-output.txt || echo "0")
        TOTAL=$((PASSED + FAILED))

        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Total:** $TOTAL tests" >> $GITHUB_STEP_SUMMARY
        echo "- **Passed:** $PASSED" >> $GITHUB_STEP_SUMMARY
        echo "- **Failed:** $FAILED" >> $GITHUB_STEP_SUMMARY

        if [ "$FAILED" -eq 0 ]; then
          echo "**All tests passed!**" >> $GITHUB_STEP_SUMMARY
        else
          echo "**$FAILED test(s) failed**" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-output.txt
        retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Build
      run: GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -v ./...

